<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{ --bg:#f6f7f9; --ink:#16181d; --sub:#8b8f98; --line:#eceef2; --accent:#ff4d2e; --kakao:#fee500; --blue:#2a62c9; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;font-weight:900;letter-spacing:-.5px}
  h1 b{color:var(--accent)}
  .when{color:var(--sub);font-size:13px;margin-top:4px;line-height:1.5}
  .how{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:14px;color:#4a4f58}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none;position:sticky;top:0;background:var(--bg);z-index:2}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip i{font-style:normal;color:var(--sub);margin-left:4px;font-size:12px}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip.on i{color:#c9ccd2}

  .deal{background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(20,24,40,.08);padding:14px;margin-top:14px}
  .deal.sent{opacity:.55}
  .top{display:flex;gap:12px;align-items:center}
  .top img{width:68px;height:68px;border-radius:12px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff}
  .tags{display:flex;gap:5px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:#f1f2f5;color:#5a5f69}
  .tag.drop{background:#ffece8;color:var(--accent)}
  .tag.gold{background:#fff3d6;color:#a86a00}
  .tag.best{background:#e9f1ff;color:var(--blue)}
  .tag.new{background:var(--accent);color:#fff}
  .tag.super{background:#16181d;color:#ffe14d}
  .deal.super{box-shadow:0 0 0 2px var(--accent),0 2px 12px rgba(20,24,40,.08)}
  .name{font-size:14.5px;font-weight:500;line-height:1.4;word-break:keep-all;margin-top:4px}
  .price{font-weight:900;margin-top:2px}
  .price s{color:var(--sub);font-weight:400;font-size:13px;margin-right:6px}
  .price em{font-style:normal;color:var(--accent);margin-left:6px;font-size:14px}
  details{margin-top:10px}
  summary{font-size:12.5px;color:var(--sub);cursor:pointer}
  pre{white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13px;line-height:1.65;background:#fffbe0;border-radius:12px;padding:12px;margin-top:8px;color:#3a3a3a}
  .copy{width:100%;margin-top:10px;padding:13px;border:none;border-radius:12px;background:var(--kakao);color:#191919;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
  .copy.done{background:#e6e8ec;color:#5a5f69}
  .empty{text-align:center;color:var(--sub);padding:44px 10px;font-size:14px;line-height:1.7}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(22,24,29,.92);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>

:9320256369-94586776590","type":"best","name":"블루나 본 퓨어 저자극 물티슈 캡형","price":7080,"image":"https://img2a.coupangcdn.com/image/retail/images/2147625288740083-e84f1ec9-b27b-44a7-80f3-505294b79453.jpg","rocket":true,"link":"https://link.coupang.com/a/im5Fo5iSRw","cat":"출산/유아동","rank":2,"was":null,"pct":null,"score":null,"low":false,"prevMin":null,"span":null,"isNew":false},{"key":"best:6586372374-82081965637","type":"best","name":"종근당건강 프로메가 오메가3 트리플","price":11200,"image":"https://image6.coupangcdn.com/image/retail/images/607967258813539-546924f8-fdf1-4e94-9397-1aa8868410df.jpg","rocket":true,"link":"https://link.coupang.com/a/im5FowbkHc","cat":"출산/유아동","rank":3,"was":null,"pct":null,"score":null,"low":false,"prevMin":null,"span":null,"isNew":false},{"key":"best:7299719601-85811303945","type":"best","name":"탐사 실속형 배변패드","price":6190,"image":"https://img2c.coupangcdn.com/image/retail/images/386688755640254-04f1dee4-b35d-4af8-8e71-816be4afdc13.jpg","rocket":true,"link":"https://link.coupang.com/a/im5FqNfYlg","cat":"반려동물","rank":1,"was":null,"pct":null,"score":null,"low":false,"prevMin":null,"span":null,"isNew":false},{"key":"best:8615130283-70734097621","type":"best","name":"캐츠랑 전연령 고양이 건식사료","price":16300,"image":"https://img3c.coupangcdn.com/image/vendor_inventory/04ba/a1bc4959876d2fe0142a25ac955787be30d58a04be47ab729f487f46f708.jpg","rocket":true,"link":"https://link.coupang.com/a/injJwwgRcO","cat":"반려동물","rank":3,"was":null,"pct":null,"score":null,"low":false,"prevMin":null,"span":null,"isNew":false},{"key":"best:9254396859-94341183135","type":"best","name":"쟈니베어 군인핫팩 특대형 180g","price":14900,"image":"https://img2a.coupangcdn.com/image/retail/images/84260456228561-aa7bbef2-e031-4324-9be4-6b2f2fd243a2.jpg","rocket":true,"link":"https://link.coupang.com/a/im5Fo18Q7E","cat":"스포츠/레저","rank":3,"was":null,"pct":null,"score":null,"low":false,"prevMin":null,"span":null,"isNew":false}]}/*END*/;

const DISCLOSURE = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.";
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 가격이 떨어진 정도(최근 며칠 최고가 대비)에 따라 등급 */
const grade = p => p >= 50 ? "⚡ 역대급 🚨🚨🚨🚨🚨" : p >= 40 ? "초특급대박 🚨🚨🚨🚨🚨" : p >= 30 ? "초대박 🚨🚨🚨🚨" : p >= 20 ? "대박 🚨🚨🚨" : "가격 급락 🚨🚨";

/* '최근 N일'은 실제로 가격을 기록한 기간이에요 (기록이 30일 안 됐으면 그만큼만) */
const period = s => s > 1 ? `최근 ${s}일` : "오늘";

/* 글 위쪽에 눈에 띄게 넣는 한 줄 (할인율·최저가는 핫템이슈가 기록한 쿠팡 가격 기준) */
function hook(d){
  const isDrop = d.type === "drop" || d.type === "super";
  return [
    ...(d.type === "super" ? [`😱 ${period(d.span)} 최고가 대비 ${d.pct}% 할인이래! 역대급이야`] : []),
    ...(d.type === "drop"  ? [`🔥 ${period(d.span)} 최고가 대비 ${d.pct}% 할인이래!`] : []),
    ...(d.type === "low" || (isDrop && d.low) ? [`📉 ${period(d.span)} 중에 최저가야!`] : []),
    ...(d.type === "gold"  ? ["⏰ 오늘의 골드박스 특가래!"] : []),
    ...(d.type === "best"  ? [`🏆 쿠팡 ${d.cat} 베스트 ${d.rank}위래!`] : []),
  ];
}

/* 카톡에 올릴 글 모양 */
function message(d){
  const counts = d.name.match(/(\d+)\s*개(?!월)/g) || [];
  const n = counts.length === 1 ? parseInt(counts[0], 10) : 0;
  const unit = n > 1 ? ` (개당 ${won(d.price / n)})` : "";
  const isDrop = d.type === "drop" || d.type === "super";
  const priceLines =
    isDrop             ? [`↳ ${grade(d.pct)} ${won(d.price)}${unit}`, `    ${won(d.was)} → ${won(d.price)} (${d.pct}%↓)`] :
    d.type === "low"   ? [`↳ 🏷️ 최저가 ${won(d.price)}${unit}`, `    이전 최저 ${won(d.prevMin)} → ${won(d.price)}`] :
    d.type === "gold"  ? [`↳ 🔥 골드박스 특가 ${won(d.price)}${unit}`] :
                         [`↳ 🏆 ${d.cat} 베스트 ${d.rank}위 ${won(d.price)}${unit}`];
  const basis = !(isDrop || d.type === "low") ? "✔️ 올린 시점의 쿠팡 판매가 기준이에요."
    : d.span > 1 ? `✔️ 할인율·최저가는 최근 ${d.span}일 동안 기록한 쿠팡 판매가 기준이에요.`
    : "✔️ 할인율은 오늘 기록한 쿠팡 판매가 기준이에요.";
  return [
    DISCLOSURE, "",
    ...hook(d), "",
    `☑️ ${d.name}`, ...priceLines,
    d.rocket ? "🚀 로켓배송" : "📦 일반배송 (로켓배송 아님)",
    "", d.link, "",
    basis,
    "✔️ 인기 딜은 빨리 품절되거나 가격이 바뀔 수 있어요!",
  ].join("\n");
}

const FILTERS = [
  { id:"all",  label:"전체",            test:() => true },
  { id:"super", label:"⚡ 초특급",       test:d => d.type === "super" },
  { id:"new",  label:"🆕 새로 들어온",   test:d => d.isNew },
  { id:"drop", label:"📉 가격 급락",     test:d => d.type === "drop" },
  { id:"low",  label:"🏷️ 최저가",        test:d => d.type === "low" || d.low },
  { id:"cheap", label:"💰 1만원 이하",   test:d => d.price <= DATA.underPrice },
  { id:"gold", label:"🔥 골드박스",      test:d => d.type === "gold" },
  ...DATA.cats.map(c => ({ id:"cat:" + c, label:"🏆 " + c, test:d => d.type === "best" && d.cat === c })),
];

/* 복사한 딜 기억하기 (이 휴대폰에만 저장) */
let sent = {};
try { sent = JSON.parse(localStorage.getItem("hottem-sent") || "{}"); } catch(e) {}
if (DATA.updated) {
  const keep = new Date(new Date(DATA.updated.slice(0, 10)).getTime() - 7 * 864e5).toISOString().slice(0, 10);
  for (const k in sent) if (sent[k] < keep) delete sent[k];
}
function markSent(key){
  sent[key] = DATA.updated.slice(0, 10);
  try { localStorage.setItem("hottem-sent", JSON.stringify(sent)); } catch(e) {}
}

const $ = id => document.getElementById(id);
let filter = DATA.deals.some(d => d.isNew && d.type === "super") ? "super" : DATA.deals.some(d => d.isNew) ? "new" : "all";

if (DATA.updated) {
  const [d, t] = DATA.updated.split(" ");
  const [, m, day] = d.split("-").map(Number);
  const c = t => DATA.deals.filter(x => x.type === t).length;
  const lows = DATA.deals.filter(x => x.type === "low" || x.low).length;
  $("when").innerHTML = `${m}월 ${day}일 ${t} 업데이트 · 10분마다 자동으로 바뀌어요<br>${c("super") ? `⚡ 초특급 ${c("super")} · ` : ""}급락 ${c("drop")} · 최저가 ${lows} · 골드박스 ${c("gold")} · 카테고리 베스트 ${c("best")}`;
}

function card(d, i){
  const lowTag = `<span class="tag drop">🏷️ ${d.span}일 최저가</span>`;
  const tag = d.type === "super" ? `<span class="tag super">⚡ ${d.pct}% 초특급</span>${d.low ? lowTag : ""}`
            : d.type === "drop" ? `<span class="tag drop">📉 ${d.pct}% 급락</span>${d.low ? lowTag : ""}`
            : d.type === "low"  ? lowTag
            : d.type === "gold" ? `<span class="tag gold">🔥 골드박스</span>`
            : `<span class="tag best">🏆 ${esc(d.cat)} ${d.rank}위</span>`;
  const price = d.type === "drop" || d.type === "super" ? `<s>${won(d.was)}</s>${won(d.price)}<em>-${d.pct}%</em>`
              : d.type === "low"  ? `<s>${won(d.prevMin)}</s>${won(d.price)}`
              : won(d.price);
  const done = !!sent[d.key];
  return `<div class="deal ${done ? "sent" : ""} ${d.type === "super" ? "super" : ""}">
    <div class="top">
      <img src="${esc(d.image)}" alt="" loading="lazy">
      <div>
        <div class="tags">${d.isNew ? `<span class="tag new">NEW</span>` : ""}${tag}${d.price <= DATA.underPrice ? `<span class="tag gold">💰 1만원 이하</span>` : ""}${d.rocket ? `<span class="tag">🚀 로켓</span>` : `<span class="tag">📦 일반배송</span>`}</div>
        <div class="name">${esc(d.name)}</div>
        <div class="price">${price}</div>
      </div>
    </div>
    <details><summary>보낼 글 미리보기</summary><pre>${esc(message(d))}</pre></details>
    <button class="copy ${done ? "done" : ""}" data-i="${i}">${done ? "✓ 복사했던 딜 · 다시 복사" : "글 복사"}</button>
  </div>`;
}

function render(){
  const f = FILTERS.find(x => x.id === filter) || FILTERS[0];
  $("chips").innerHTML = FILTERS.map(x => {
    const n = DATA.deals.filter(x.test).length;
    if (!n && !["all", "drop", "low"].includes(x.id)) return "";
    return `<button class="chip ${x.id === filter ? "on" : ""}" data-f="${x.id}">${x.label}<i>${n}</i></button>`;
  }).join("");
  const items = DATA.deals.map((d, i) => [d, i]).filter(([d]) => f.test(d));
  $("list").innerHTML = items.length ? items.map(([d, i]) => card(d, i)).join("")
    : filter === "drop" ? `<div class="empty">지금은 최근 ${DATA.days}일 최고가보다<br>${DATA.dropPct}% 넘게 떨어진 상품이 없어요.<br>매시간 가격을 기록하면서 계속 찾고 있어요.</div>`
    : filter === "low" ? `<div class="empty">지금은 최저가를 새로 찍은 상품이 없어요.<br>가격 기록이 ${DATA.minDays}일 넘게 쌓인 상품부터<br>최근 ${DATA.days}일 최저가를 찾아요.</div>`
    : `<div class="empty">지금은 보여줄 딜이 없어요</div>`;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if (!b) return;
  filter = b.dataset.f; render();
});

let tt;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2000); }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  const d = DATA.deals[b.dataset.i];
  if (await copyText(message(d))) {
    markSent(d.key);
    b.textContent = "✓ 복사됨 · 카톡에 붙여넣으세요"; b.classList.add("done");
    b.closest(".deal").classList.add("sent");
    toast("복사했어요 📋");
  } else toast("복사가 안 됐어요. 미리보기 글을 길게 눌러 복사해주세요");
});

render();
</script>
