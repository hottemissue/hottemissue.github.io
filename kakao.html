<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>카톡 핫딜 글</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📣</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{ --bg:#f6f7f9; --ink:#16181d; --sub:#8b8f98; --line:#eceef2; --accent:#ff4d2e; --kakao:#fee500; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:480px;margin:0 auto;padding:22px 16px 60px}
  h1{font-size:22px;font-weight:900;letter-spacing:-.5px}
  h1 b{color:var(--accent)}
  .when{color:var(--sub);font-size:13px;margin-top:4px}
  .how{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.7;margin-top:14px;color:#4a4f58}
  .deal{background:#fff;border-radius:18px;box-shadow:0 2px 12px rgba(20,24,40,.08);padding:14px;margin-top:14px}
  .top{display:flex;gap:12px;align-items:center}
  .top img{width:64px;height:64px;border-radius:12px;object-fit:cover;border:1px solid var(--line);flex:none;background:#fff}
  .num{font-size:12px;font-weight:700;color:var(--sub)}
  .name{font-size:14.5px;font-weight:500;line-height:1.4;word-break:keep-all}
  .price{font-weight:900;margin-top:2px}
  pre{white-space:pre-wrap;word-break:break-all;font-family:inherit;font-size:13px;line-height:1.65;background:#fffbe0;border-radius:12px;padding:12px;margin-top:12px;color:#3a3a3a}
  .copy{width:100%;margin-top:10px;padding:13px;border:none;border-radius:12px;background:var(--kakao);color:#191919;font-weight:700;font-size:15px;font-family:inherit;cursor:pointer}
  .copy.done{background:#e6e8ec;color:#5a5f69}
  .empty{text-align:center;color:var(--sub);padding:50px 0;font-size:14px}
  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(22,24,29,.92);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap">
  <h1>📣 카톡 <b>핫딜 글</b></h1>
  <p class="when" id="when"></p>
  <div class="how">① <b>글 복사</b>를 눌러요 → ② 카톡 오픈채팅방에 붙여넣기 → ③ 전송<br>링크가 들어 있어서 카톡이 상품 사진 미리보기를 자동으로 붙여줘요.</div>
  <div id="list"></div>
</div>
<div class="toast" id="toast"></div>

<script>
/* 아래 DATA는 tools/daily.ps1이 매일 쿠팡 골드박스로 채워요. 직접 고치지 않아도 돼요. */
const DATA = /*DATA*/{"updated":"2026-11-03 14:03","deals":[{"name":"바이탈플랜트 인덕션 롤팬 뉴오리지널 그레이","price":112000,"image":"https://image2.coupangcdn.com/image/retail/images/311842535806587-16613cc6-7376-4fb9-82cf-0791a12f08b1.jpg","rocket":true,"category":"주방용품","link":"https://link.coupang.com/a/im03vJ9PG2"},{"name":"마이밀 정품 뉴프로틴 고소한맛","price":74900,"image":"https://image1.coupangcdn.com/image/retail/images/60196325275947-60de8422-5657-47a7-9f76-630c6405a017.jpg","rocket":true,"category":"식품","link":"https://link.coupang.com/a/im03vNZY60"},{"name":"다우니 실내건조 초고농축 섬유유연제 프레시 클린 자스민향 리필","price":21990,"image":"https://img2a.coupangcdn.com/image/retail/images/279930070077795-4f634634-ef99-4440-ba8a-57ea14fa2f51.jpg","rocket":true,"category":"생활용품","link":"https://link.coupang.com/a/im03vQQ3xI"},{"name":"깨끗한나라 벚꽃 로맨틱 천연펄프 3겹 고급롤화장지","price":16380,"image":"https://image11.coupangcdn.com/image/retail/images/2159034107554856-af28941e-245f-4729-acf6-7d36dd5b122f.png","rocket":true,"category":"생활용품","link":"https://link.coupang.com/a/im03vUiGpE"},{"name":"헤드앤숄더 두피 토탈 솔루션 딥클린 샴푸","price":13990,"image":"https://image3.coupangcdn.com/image/retail/images/498427748594674-67f6ca2e-dadd-4469-9ec4-6e59d4920b78.jpg","rocket":true,"category":"뷰티","link":"https://link.coupang.com/a/im03vXElxc"},{"name":"오리고 플리스 블랭킷","price":26140,"image":"https://img1c.coupangcdn.com/image/retail/images/96249789560498-052ef987-6237-4b0e-864b-9d68c70d3542.jpg","rocket":true,"category":"가구/홈인테리어","link":"https://link.coupang.com/a/im03v0dOPQ"},{"name":"다이슨 빅 + 콰이엇 공기청정기 BP04","price":889000,"image":"https://image4.coupangcdn.com/image/retail/images/2025/09/08/16/8/50881fd9-0014-4c6e-ae0e-49057901b434.jpg","rocket":true,"category":"가전디지털","link":"https://link.coupang.com/a/im03v6M18u"},{"name":"뉴발란스 스탠다드 중목 양말 5팩 NBDSDMDL","price":17900,"image":"https://image1.coupangcdn.com/image/retail/images/891378276835897-489d351b-5663-4261-a841-3bac390828a7.jpg","rocket":true,"category":"패션잡화","link":"https://link.coupang.com/a/im03waywM0"},{"name":"르몽스 먼지없는 알러지케어 차렵이불 세트","price":55090,"image":"https://image15.coupangcdn.com/image/vendor_inventory/092f/a40820091adc1fb439e29b404a6023aee8fa551677e0938d18c8e78cff3b.png","rocket":true,"category":"가구/홈인테리어","link":"https://link.coupang.com/a/im03wf7l7s"},{"name":"다기능 마늘 다지기 고기 다지기 전동 다지기 믹서기 만능 다지기","price":19900,"image":"https://image2.coupangcdn.com/image/vendor_inventory/1fb7/7d72c1b03de15f37587d724d91cd72ca26a085b31eae867321f6289f31fb.jpg","rocket":true,"category":"가전디지털","link":"https://link.coupang.com/a/im03wjVh48"}]}/*END*/;

const DISCLOSURE = "이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.";
const won = n => Math.round(n).toLocaleString("ko-KR") + "원";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 카톡에 올릴 글 모양 */
function message(d){
  const counts = d.name.match(/(\d+)\s*개(?!월)/g) || [];
  const n = counts.length === 1 ? parseInt(counts[0], 10) : 0;
  const unit = n > 1 ? ` (개당 ${won(d.price / n)})` : "";
  return [
    DISCLOSURE,
    "",
    `☑️ ${d.name}`,
    `↳ 🔥 골드박스 특가 ${won(d.price)}${unit}`,
    ...(d.rocket ? ["🚀 로켓배송"] : []),
    "",
    d.link,
    "",
    "✔️ 올린 시점의 쿠팡 판매가 기준이에요.",
    "✔️ 인기 딜은 빨리 품절되거나 가격이 바뀔 수 있어요!",
  ].join("\n");
}

const $ = id => document.getElementById(id);
if (DATA.updated) {
  const [d, t] = DATA.updated.split(" ");
  const [y, m, day] = d.split("-").map(Number);
  $("when").textContent = `${y}년 ${m}월 ${day}일 ${t} 업데이트 · 골드박스 ${DATA.deals.length}개`;
}

$("list").innerHTML = DATA.deals.length ? DATA.deals.map((d, i) => `
  <div class="deal">
    <div class="top">
      <img src="${esc(d.image)}" alt="" loading="lazy">
      <div><div class="num">${i + 1}번째 딜</div><div class="name">${esc(d.name)}</div><div class="price">${won(d.price)}</div></div>
    </div>
    <pre>${esc(message(d))}</pre>
    <button class="copy" data-i="${i}">글 복사</button>
  </div>`).join("") : `<div class="empty">아직 오늘 가져온 특가가 없어요</div>`;

let tt;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2000); }

async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch(e){
    const ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  }
}

$("list").addEventListener("click", async e => {
  const b = e.target.closest(".copy"); if (!b) return;
  if (await copyText(message(DATA.deals[b.dataset.i]))) {
    b.textContent = "✓ 복사됨 · 카톡에 붙여넣으세요"; b.classList.add("done");
    toast("복사했어요 📋");
  } else toast("복사가 안 됐어요. 글을 길게 눌러 복사해주세요");
});
</script>
</body>
</html>
