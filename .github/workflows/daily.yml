# 10분마다 쿠팡 골드박스 + 카테고리 베스트를 가져와 가격을 기록하고,
# 가격이 떨어진 상품까지 골라 kakao.html(카톡 글 페이지)을 새로 만들어 올려요.
# 일반 알림은 새 딜을 모아서 1시간에 한 번, 초특급(50% 이상 급락)은 바로 긴급 알림을 보내요.
# 단, 한국시간 밤 11시 ~ 아침 7시에는 90% 이상 떨어진 초특급만 알림을 보내요.
# GitHub 예약 실행은 45~60분 간격으로 늦어져서, 한 번 실행될 때 안에서 10분 간격으로 6번 확인해요.
# 한 실행이 끝나면 대기 중이던 다음 실행이 이어서 시작돼요 (concurrency).
# API 키는 저장소 Settings > Secrets and variables > Actions 에 넣어둔 값을 써요.
name: 10분마다 핫딜 카톡 글

on:
  schedule:
    - cron: "2,32 * * * *"  # 다음 실행을 대기시켜 두는 용도 (실제 확인 간격은 run-checks.ps1이 맞춰요)
  workflow_dispatch:        # Actions 탭에서 'Run workflow'로 바로 돌릴 수도 있어요.
    inputs:
      checks:
        description: "몇 번 확인할지 (10분 간격)"
        default: "1"
      test_notify:
        description: "시험 알림 보내기"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-deals
  cancel-in-progress: false

jobs:
  update:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main   # 대기했다 시작한 실행도 예약 당시 옛날 상태 말고 지금 최신 상태에서 시작해요

      - name: 핫딜 확인하고 올리기
        shell: powershell
        env:
          COUPANG_ACCESS_KEY: ${{ secrets.COUPANG_ACCESS_KEY }}
          COUPANG_SECRET_KEY: ${{ secrets.COUPANG_SECRET_KEY }}
          THREADS_BOT_READ: ${{ secrets.THREADS_BOT_READ }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: ./tools/run-checks.ps1 -Checks ${{ github.event_name == 'schedule' && 6 || inputs.checks || 1 }} ${{ inputs.test_notify && '-TestNotify' || '' }}
