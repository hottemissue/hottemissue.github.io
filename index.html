<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>핫템이슈</title>
<meta name="description" content="요즘 뜨는 감성템 · 쿠팡 특가만 골라 담았어요">
<meta property="og:type" content="website">
<meta property="og:title" content="핫템이슈">
<meta property="og:description" content="요즘 뜨는 감성템 · 쿠팡 특가만 골라 담았어요 🛒">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔥</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
  :root{
    --bg:#ffffff; --ink:#16181d; --sub:#8b8f98; --line:#eceef2;
    --card:#ffffff; --soft:#f6f7f9; --accent:#ff4d2e; --banner:#fdf1dc; --bannerInk:#5b6b2e;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{padding-bottom:env(safe-area-inset-bottom)}
  .wrap{max-width:480px;margin:0 auto;padding:0 18px 40px}

  /* 대가성 문구 배너 */
  .banner{background:var(--banner);color:var(--bannerInk);font-weight:700;font-size:13px;overflow:hidden;white-space:nowrap;padding:12px 0;padding-top:calc(12px + env(safe-area-inset-top))}
  .banner span{display:inline-block;padding-left:100%;animation:flow 22s linear infinite}
  @keyframes flow{to{transform:translateX(-100%)}}

  header{display:flex;align-items:center;justify-content:space-between;padding:22px 0 8px}
  .icon-btn{width:44px;height:44px;border-radius:50%;border:none;background:#d9dbe0;display:grid;place-items:center;cursor:pointer}
  .icon-btn svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .logo{font-size:30px;font-weight:900;letter-spacing:-1px}
  .logo b{color:var(--accent)}

  .profile{text-align:center;padding:14px 0 18px}
  .handle{font-size:24px;font-weight:900;letter-spacing:-.5px}
  .bio{color:var(--sub);font-size:13.5px;margin-top:6px;line-height:1.5}
  .biz{display:inline-flex;align-items:center;gap:8px;margin-top:14px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:#fff;font-weight:700;font-size:14px;color:var(--ink);cursor:pointer;font-family:inherit}
  .biz svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}

  .search{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
  .search svg{width:20px;height:20px;stroke:#9aa0a8;fill:none;stroke-width:2;flex:none}
  .search input{border:none;background:transparent;outline:none;font-size:15px;width:100%;font-family:inherit;color:var(--ink)}
  .search input::placeholder{color:#b3b7be}

  .chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13.5px;font-weight:500;cursor:pointer;font-family:inherit;color:var(--ink)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .list{display:flex;flex-direction:column;gap:14px;margin-top:14px}
  .card{display:flex;align-items:center;gap:14px;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 2px 12px rgba(20,24,40,.08);text-decoration:none;color:inherit;transition:transform .12s}
  .card:active{transform:scale(.98)}
  .thumb{width:76px;height:76px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:38px;overflow:hidden}
  .thumb svg,.thumb img{width:100%;height:100%;display:block}
  .thumb img{object-fit:cover}
  .thumb.photo{background:#fff!important;border:1px solid var(--line)}
  .info{flex:1;min-width:0}
  .title{font-size:15.5px;font-weight:500;line-height:1.4;letter-spacing:-.2px;word-break:keep-all}
  .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--soft);color:#5a5f69}
  .tag.hot{background:#ffece8;color:var(--accent)}
  .tag.price{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .tag.rocket{background:#e9f1ff;color:#2a62c9}
  .arrow{color:#c5c8ce;font-size:20px;flex:none;padding-right:4px}

  .pin{background:linear-gradient(135deg,#fff7ec,#fff);border:1px solid #ffe2c2}
  .pin .title{font-weight:700}
  .section{font-size:13px;color:var(--sub);font-weight:700;margin:26px 2px 0}
  .empty{text-align:center;color:var(--sub);padding:40px 0;font-size:14px;display:none}

  footer{text-align:center;color:#b0b4bb;font-size:11.5px;line-height:1.6;margin-top:34px}

  .toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(22,24,29,.92);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="banner"><span>이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</span></div>

<div class="wrap">

    <button class="icon-btn" id="shareBtn" aria-label="공유">
      <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 8l5-5 5 5"/><path d="M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>
    </button>
    <div class="logo">핫템<b>이슈</b></div>
    <button class="icon-btn" id="bellBtn" aria-label="카톡 알림방">
      <svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
    </button>
  </header>

  <section class="profile">
    <div class="handle">hottem.issue</div>
    <p class="bio">요즘 뜨는 감성템 · 쿠팡 특가만 골라 담았어요 🛒<br>번호로 검색하면 바로 찾을 수 있어요</p>

      비즈니스 제안
    </button>
  </section>

  <label class="search">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="번호나 상품명을 입력해주세요." autocomplete="off">
  </label>

  <div class="chips" id="chips"></div>

  <div class="list" id="pinned"></div>
  <div class="section" id="secLabel">전체 상품</div>
  <div class="list" id="list"></div>

  <footer>

  </footer>
</div>

const CATS = ["전체","쓰레드","겨울템","감성템","생활","주방","디지털"];
const CAT_ICON = {"전체":"","쓰레드":"🧵 ","겨울템":"❄️ ","감성템":"✨ ","생활":"🏠 ","주방":"🍳 ","디지털":"💻 "};
const BIZ_EMAIL = "hseojun7@naver.com";

/* ===================== 아래는 건드리지 않아도 돼요 ===================== */
let cat = "전체";
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(3,"0");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function card(p, isPin){
  const tags = isPin ? (p.tags||[]).map(t=>`<span class="tag">${esc(t)}</span>`).join("")
    : [`<span class="tag ${p.cat==="겨울템"?"hot":""}">${CAT_ICON[p.cat]||""}${esc(p.cat)}</span>`,
       p.price ? `<span class="tag price">${p.price.toLocaleString("ko-KR")}원</span>` : "",
       p.rocket ? `<span class="tag rocket">🚀 로켓배송</span>` : ""].join("");
  const title = isPin ? esc(p.title) : `[${pad(p.no)}] ${esc(p.title)}`;
  const thumb = p.photo ? `<img src="${esc(p.photo)}" alt="" loading="lazy" data-fb="${esc(p.img||"")}">` : (THUMB[p.img]||p.emoji);
  return `<a class="card ${isPin?"pin":""}" href="${esc(p.link)}" target="_blank" rel="noopener sponsored">
    <div class="thumb ${p.photo?"photo":""}" style="background:${p.bg}">${thumb}</div>
    <div class="info"><div class="title">${title}</div><div class="meta">${tags}</div></div>
    <div class="arrow">›</div></a>`;
}

function render(){
  const q = $("q").value.trim().toLowerCase().replace(/^\[?0*/,"").replace(/\]$/,"");
  const items = PRODUCTS.filter(p =>
    (cat==="전체" || p.cat===cat) &&
    (!q || String(p.no)===q || p.title.toLowerCase().includes(q) || p.cat.includes(q))
  );
  $("list").innerHTML = items.map(p=>card(p,false)).join("");
  $("empty").style.display = items.length ? "none" : "block";
  const filtering = q || cat!=="전체";
  $("pinned").style.display = filtering ? "none" : "flex";
  $("secLabel").textContent = q ? `검색 결과 ${items.length}개` : (cat==="전체" ? "전체 상품" : `${CAT_ICON[cat]}${cat}`);
}

$("pinned").innerHTML = PINNED.map(p=>card(p,true)).join("");
$("chips").innerHTML = CATS.map(c=>`<button class="chip ${c===cat?"on":""}" data-c="${c}">${CAT_ICON[c]}${c}</button>`).join("");
$("chips").addEventListener("click", e=>{
  const b = e.target.closest(".chip"); if(!b) return;
  cat = b.dataset.c;
  document.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on", x===b));
  render();
});
$("q").addEventListener("input", render);

/* 상품 사진이 안 열리면 그림 썸네일로 대신 보여줘요 */
document.addEventListener("error", e => {
  const im = e.target;
  if (im.tagName === "IMG" && im.dataset.fb !== undefined) im.parentElement.innerHTML = THUMB[im.dataset.fb] || "🛍️";
}, true);

let tt;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(tt); tt=setTimeout(()=>t.classList.remove("show"),2200); }
async function copy(text, msg){
  try{ await navigator.clipboard.writeText(text); toast(msg); }catch(e){ toast(text); }
}
$("shareBtn").onclick = ()=> copy(location.href.split("#")[0], "페이지 링크를 복사했어요 🔗");
$("bellBtn").onclick  = ()=> window.open(KAKAO_CHAT, "_blank", "noopener");
$("bizBtn").onclick   = ()=> copy(BIZ_EMAIL, `이메일 복사됨: ${BIZ_EMAIL}`);

render();
</script>
